apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vision-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vision-service
  minReplicas: 1
  maxReplicas: 4
  # CPU usage says little about a GPU pod's headroom, so scale on open streams only.
  metrics:
    - type: Pods
      pods:
        metric:
          name: vision_streams_in_flight
        target:
          type: AverageValue
          # Starting point; revisit with the M6 benchmark numbers.
          averageValue: "16"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
