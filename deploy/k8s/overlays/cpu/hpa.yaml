apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vision-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vision-service
  minReplicas: 1
  maxReplicas: 8
  # The HPA takes the larger of the two proposals. CPU covers HTTP traffic; open
  # streams cover WebSocket clients, whose load arrives before CPU catches up.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          # Served by prometheus-adapter, see deploy/k8s/prometheus-adapter.
          name: vision_streams_in_flight
        target:
          type: AverageValue
          # Starting point; revisit with the M6 benchmark numbers.
          averageValue: "4"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Streams are long-lived; scaling down too eagerly forces reconnects.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
